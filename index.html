<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Living Folders · Jev</title>
    <link rel="stylesheet" href="style.css?v=9">
  </head>
  <body>
    <main class="finder-window" aria-label="Living Folders demo">
      <header class="titlebar">
        <div class="traffic-lights" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="window-title">
          <span>Living Folders</span>
        </div>
        <div class="jev-pill" id="mode"><i></i><span>Checking Jev</span></div>
      </header>

      <div class="finder-body">
        <section class="content">
          <nav class="toolbar" aria-label="Finder toolbar">
            <div class="path"><b>Desktop</b><span class="path-count">30 files</span></div>
            <button class="new-folder" id="newFolder">＋ New folder</button>
          </nav>

          <section class="command-deck">
            <div class="name-field-wrap">
              <label for="folderName">Name a folder. The right files find it.</label>
              <div class="name-field">
                <span class="folder-glyph large" aria-hidden="true"></span>
                <input id="folderName" type="text" maxlength="160" autocomplete="off" spellcheck="false" placeholder="What belongs here?" aria-describedby="thinkingStatus">
                <span class="thinking-dots" id="thinkingDots" aria-hidden="true"><i></i><i></i><i></i></span>
              </div>
              <div class="field-footer">
                <span id="thinkingStatus" role="status">No Enter key. The folder responds as you type.</span>
                <button id="clearName" aria-label="Clear folder name">Clear</button>
              </div>
            </div>
            <div class="demo-beats" aria-label="Demo phrases">
              <span>Try</span>
              <button data-folder="Stuff for my Japan trip">Japan trip</button>
              <button data-folder="Stuff I need at the airport">At the airport</button>
              <button data-folder="Things I downloaded to become a different person">A different person</button>
              <button data-folder="Fine. Just the Python tutorials.">Just Python</button>
            </div>
          </section>

          <section class="workspace" id="workspace" aria-label="Virtual desktop with sample files">
            <div class="desktop-zone">
              <div class="zone-heading"><span>All files</span><b id="looseCount">30 scattered</b></div>
            </div>
            <div class="folder-zone" id="folderZone">
              <div class="folder-tab"></div>
              <div class="folder-surface">
                <div class="folder-heading">
                  <div><span class="folder-glyph" aria-hidden="true"></span><strong id="folderTitle">Your living folder</strong></div>
                  <span id="matchCount">Waiting for a name</span>
                </div>
                <div class="empty-folder" id="emptyFolder">
                  <span class="folder-glyph empty-icon" aria-hidden="true"></span>
                  <strong>A little room for your next idea.</strong>
                  <p>Start with a name above.</p>
                </div>
              </div>
            </div>
            <div id="fileLayer" aria-live="polite"></div>
            <div class="movement-toast" id="movementToast" role="status"></div>
          </section>

          <footer class="statusbar">
            <span id="statusSummary">30 sample files · 0 gathered</span>
            <span>Virtual folders · Original files stay put</span>
          </footer>
        </section>
      </div>
    </main>
    <script src="app.js?v=6"></script>
  </body>
</html>
